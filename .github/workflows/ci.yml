name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: mab-benchmark version
      - run: mab-benchmark validate examples/study_quick.yaml

  obp-equality:
    # obp 0.5.7 pins numpy 1.23.5, pandas 1.5.2, scipy 1.9.3 and torch 1.12, so it
    # cannot share an environment with the main install; this job installs obp first
    # and mab-benchmark without dependencies, then runs the OPE tests, including the
    # check that the native estimators equal obp's to rel. 1e-10.
    name: OPE estimators equal obp 0.5.7 (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install "obp==0.5.7" "matplotlib<3.8" pytest
      - run: pip install --no-deps -e .
      - run: python -c "import obp, mab_benchmark.analysis.ope as o; assert o.obp_available()"
      - run: python -m pytest -q tests/test_ope.py

  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict
